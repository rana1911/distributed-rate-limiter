services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    build: .
    environment:
      - REDIS_HOST=redis
      - PORT=3000
      - INSTANCE_ID=rate-limiter-1
    expose:
      - "3000"
    ports:
      - "3001:3000"
    depends_on:
      redis:
        condition: service_healthy

  app2:
    build: .
    environment:
      - REDIS_HOST=redis
      - PORT=3000
      - INSTANCE_ID=rate-limiter-2
    expose:
      - "3000"
    ports:
      - "3002:3000"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2

  dashboard:
    build:
      context: ./dashboard
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_METRICS_URLS=http://localhost:3001/metrics,http://localhost:3002/metrics
    ports:
      - "5173:5173"
    depends_on:
      - nginx